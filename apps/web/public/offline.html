<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Bağlantı yok · Haber Nexus</title>
<style>
  :root { color-scheme: light dark; --bg: #fafbfc; --fg: #0f172a; --muted: #64748b; --accent: #dc2626; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0b0f1a; --fg: #e2e8f0; --muted: #94a3b8; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg);
         font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding: 24px; box-sizing: border-box; }
  main { max-width: 420px; text-align: center; }
  h1 { font-size: 1.5rem; margin: 0 0 8px; }
  p { color: var(--muted); margin: 0 0 24px; }
  button { font: inherit; font-weight: 600; color: #fff; background: var(--accent); border: 0; border-radius: 12px; padding: 12px 24px; cursor: pointer; }
</style>
</head>
<body>
<main>
  <h1>İnternet bağlantısı yok</h1>
  <p>Bu sayfa şu anda yüklenemedi. Bağlantınız geri geldiğinde tekrar deneyin.</p>
  <button type="button" onclick="location.reload()">Tekrar dene</button>
</main>
</body>
</html>
