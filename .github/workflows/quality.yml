name: Quality Gates

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        working-directory: .
        run: npm ci

      - name: Generate Prisma client
        working-directory: apps/web
        run: npm run prisma:generate

      - name: Typecheck
        working-directory: apps/web
        run: npm run typecheck

      - name: Lint
        working-directory: apps/web
        run: npm run lint

      - name: Unit tests
        working-directory: apps/web
        run: npm run test

      - name: Production build
        working-directory: apps/web
        env:
          # Derlemedeki tip denetimi varsayılan 2 GB yığını aşıyor
          NODE_OPTIONS: --max-old-space-size=6144
          # Yalnızca derleme için sahte değer; gerçek anahtar Vercel ortamındadır
          BETTER_AUTH_SECRET: ci-build-only-not-a-real-secret-000000
          NEXT_PUBLIC_APP_URL: https://habernexus.com
        run: npm run build

      - name: Production dependency audit (critical gate)
        working-directory: .
        run: npm audit --omit=dev --audit-level=critical

      - name: Full dependency audit (informational)
        working-directory: .
        continue-on-error: true
        run: npm audit --audit-level=high

  # Uçtan uca duman testleri: boş bir Postgres'e göçler + örnek veri, üretim derlemesi, Playwright (Chromium)
  web-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/e2e
      # Yalnızca test için sahte değer; gerçek anahtar Vercel ortamındadır
      BETTER_AUTH_SECRET: ci-e2e-only-not-a-real-secret-0000000000
      BETTER_AUTH_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        working-directory: .
        run: npm ci

      - name: Prepare database
        working-directory: apps/web
        run: |
          npm run prisma:generate
          npx prisma migrate deploy
          npx tsx prisma/seed.ts
          npm run e2e:seed

      - name: Production build
        working-directory: apps/web
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: npm run build

      - name: Install Playwright Chromium
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        working-directory: apps/web
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
