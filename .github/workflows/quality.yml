name: Quality Gates

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        working-directory: .
        run: npm ci

      - name: Generate Prisma client
        working-directory: apps/web
        run: npm run prisma:generate

      - name: Typecheck
        working-directory: apps/web
        run: npm run typecheck

      - name: Lint
        working-directory: apps/web
        run: npm run lint

      - name: Unit tests
        working-directory: apps/web
        run: npm run test

      - name: Production build
        working-directory: apps/web
        env:
          # Derlemedeki tip denetimi varsayılan 2 GB yığını aşıyor
          NODE_OPTIONS: --max-old-space-size=6144
          # Yalnızca derleme için sahte değer; gerçek anahtar Vercel ortamındadır
          BETTER_AUTH_SECRET: ci-build-only-not-a-real-secret-000000
          NEXT_PUBLIC_APP_URL: https://habernexus.com
        run: npm run build

      - name: Production dependency audit (critical gate)
        working-directory: .
        run: npm audit --omit=dev --audit-level=critical

      - name: Full dependency audit (informational)
        working-directory: .
        continue-on-error: true
        run: npm audit --audit-level=high
